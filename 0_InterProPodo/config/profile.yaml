executor: slurm

default-resources:
  # - slurm_partition=<your_partition>  # optional, adjust as needed
  - runtime=60  # in minutes
  - cpus_per_task=1

restart-times: 0
max-jobs-per-second: 10
max-status-checks-per-second: 1
jobs: 50
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
latency-wait: 8
